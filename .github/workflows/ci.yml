name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # adds the "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two jobs: your own OS, plus Linux on the oldest Python the project supports.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests (offline; includes the repository secret scan)
        run: pytest -q

      - name: CLI smoke
        run: |
          unifaculty --version
          unifaculty universities
