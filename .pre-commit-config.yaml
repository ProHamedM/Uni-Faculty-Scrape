# One-time setup (Windows PowerShell or bash):
#   python -m pip install pre-commit
#   pre-commit install
# Then every `git commit` runs these checks first. Refresh versions with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks            # blocks commits that contain API keys, tokens, private keys

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: unifaculty-secret-scan
        name: unifaculty secret scan (tests/test_no_secrets.py)
        entry: python -m unittest tests.test_no_secrets
        language: system
        pass_filenames: false
        always_run: true
